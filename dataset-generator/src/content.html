<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        <div class="grid">
            <div class="capture">
                <div class="camera"></div>
            </div>
            <span class="ptl dw">
                <span class="letter">N</span>
                <span class="score">1</span>
            </span>
            <span class="ptc tw">
                <span class="letter">N</span>
                <span class="score">1</span>
            </span>
            <span class="ptr dl">
                <span class="letter">N</span>
                <span class="score">1</span>
            </span>
            <span class="pcl">
                <span class="letter">N</span>
                <span class="score">3</span>
            </span>
            <span class="pcc empty">
                <span class="letter">A</span>
                <span class="score">1</span>
            </span>
            <span class="pcr">
                <span class="letter">E</span>
                <span class="score">1</span>
            </span>
            <span class="pbl tw empty">
                <span class="letter">N</span>
                <span class="score">1</span>
            </span>
            <span class="pbc dl empty">
                <span class="letter">N</span>
                <span class="score">1</span>
            </span>
            <span class="pbr tl empty">
                <span class="letter">N</span>
                <span class="score">1</span>
            </span>
        </div>
        <script src="./script.js"></script>
    </body>
</html>
